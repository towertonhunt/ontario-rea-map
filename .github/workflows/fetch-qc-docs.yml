name: Fetch Quebec document catalogue

# Harvests every BAPE dossier's documentation pages (all pages, with each
# document's cote and date) into data/raw/qc_bape_doc_catalogue.json, then
# regenerates the per-project catalogues under data/docs/qc/. Resumable:
# dossiers whose page count is unchanged are skipped, so the weekly run
# only re-reads dossiers that grew.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-read every dossier even if its page count is unchanged'
        type: boolean
        default: false
  schedule:
    - cron: '17 9 * * 3'
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-qc-docs.yml']

permissions:
  contents: write

concurrency:
  group: fetch-qc-docs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Harvest BAPE documentation pages
        run: |
          ARGS=""
          [ "${{ inputs.force }}" = "true" ] && ARGS="--force"
          python3 scripts/fetch_qc_docs.py $ARGS

      - name: Rebuild catalogues and map data
        run: |
          python3 scripts/split_doc_catalogues.py
          python3 scripts/build_national_geojson.py
          python3 scripts/build_api.py
          python3 scripts/validate_data.py

      # Reset onto current main and re-apply the harvest output rather than
      # rebasing generated files (the archive lane rewrites the same
      # catalogues every six hours).
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/raw/qc_bape_doc_catalogue.json /tmp/qc_bape_doc_catalogue.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset -q --hard origin/main
            cp /tmp/qc_bape_doc_catalogue.json data/raw/qc_bape_doc_catalogue.json
            python3 scripts/split_doc_catalogues.py
            python3 scripts/build_national_geojson.py
            python3 scripts/build_api.py
            git add data/raw/qc_bape_doc_catalogue.json data/docs data/projects_canada.geojson data/api
            git commit -m "Quebec BAPE document harvest [skip ci]" || { echo "nothing to commit"; break; }
            git push && break
            echo "push rejected; retrying against newer main"
            sleep 7
          done
