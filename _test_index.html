<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canada EA Atlas</title>

  <!-- Leaflet -->
  
  <script src="_leaflet-shim.js"></script>

  <!-- Leaflet.markercluster -->
  
  
  

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Header ── */
    #header {
      background: #1a3a5c;
      color: white;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      z-index: 1000;
    }
    #header h1 { font-size: 1rem; font-weight: 600; white-space: nowrap; }
    #header .subtitle { font-size: 0.75rem; opacity: 0.7; }

    /* ── Filter bar ── */
    #filters {
      background: #f0f4f8;
      border-bottom: 1px solid #d0d7de;
      padding: 8px 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    #filters label { font-size: 0.78rem; color: #555; font-weight: 500; }
    #filters select, #filters input[type=text] {
      font-size: 0.78rem;
      padding: 4px 8px;
      border: 1px solid #c0c8d0;
      border-radius: 4px;
      background: white;
    }
    .filter-group { display: flex; align-items: center; gap: 5px; }
    #count-badge {
      margin-left: auto;
      font-size: 0.75rem;
      background: #1a3a5c;
      color: white;
      padding: 3px 9px;
      border-radius: 10px;
    }

    /* ── Main layout ── */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── Map ── */
    #map { flex: 1; }

    /* ── Sidebar ── */
    #sidebar {
      width: 380px;
      min-width: 320px;
      background: white;
      border-left: 1px solid #d0d7de;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.2s;
    }
    #sidebar.hidden { width: 0; min-width: 0; }

    #sidebar-header {
      background: #1a3a5c;
      color: white;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      flex-shrink: 0;
    }
    #sidebar-header h2 { font-size: 0.95rem; font-weight: 600; line-height: 1.3; }
    #sidebar-close {
      background: none; border: none; color: white; font-size: 1.2rem;
      cursor: pointer; padding: 0; flex-shrink: 0; line-height: 1;
    }

    #sidebar-meta {
      padding: 10px 14px;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
      font-size: 0.8rem;
    }
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
    .meta-item label { color: #888; font-size: 0.72rem; display: block; text-transform: uppercase; letter-spacing: 0.03em; }
    .meta-item span { font-weight: 500; color: #222; }

    /* Type badge */
    .type-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .type-wind    { background: #dbeafe; color: #1e40af; }
    .type-solar   { background: #fef3c7; color: #92400e; }
    .type-biogas  { background: #dcfce7; color: #166534; }

    /* Doc sections */
    #doc-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
    }
    .doc-section { margin-bottom: 12px; }
    .doc-section-title {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
      margin-bottom: 5px;
      padding-bottom: 3px;
      border-bottom: 1px solid #eee;
    }
    .doc-link {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 4px 0;
      font-size: 0.8rem;
      color: #1a3a5c;
      text-decoration: none;
      line-height: 1.3;
    }
    .doc-link:hover { color: #2563eb; }
    .doc-link::before { content: "📄"; flex-shrink: 0; font-size: 0.85rem; }
    .no-docs { font-size: 0.82rem; color: #888; font-style: italic; padding: 8px 0; }

    /* Legend */
    #legend {
      position: absolute;
      bottom: 28px;
      left: 12px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.78rem;
      z-index: 999;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    #legend h4 { font-size: 0.75rem; margin-bottom: 7px; color: #444; }
    .legend-row { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
    .legend-icon { font-size: 1rem; line-height: 1; flex-shrink: 0; }

    /* Responsive */
    @media (max-width: 700px) {
      #sidebar { position: absolute; right: 0; top: 0; bottom: 0; z-index: 800; width: 100% !important; }
      #sidebar.hidden { width: 0 !important; }
    }
    .doc-archive { font-size: 0.72rem; color: #6b7280; margin-top: -4px; padding-left: 14px; }
    .doc-link.doc-map::before { content: "🗺"; }

    /* Basemap switcher (Leaflet control) */
    .basemap-ctl { background: white; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.3); display: flex; overflow: hidden; }
    .basemap-ctl button {
      border: none; background: white; padding: 5px 9px; font-size: 0.74rem; cursor: pointer; color: #333;
      border-right: 1px solid #e5e7eb; font-family: inherit;
    }
    .basemap-ctl button:last-child { border-right: none; }
    .basemap-ctl button.active { background: #1a3a5c; color: white; }
    .basemap-ctl button:hover:not(.active) { background: #f0f4f8; }

    /* Layout (footprint) elements */
    .fp-turbine { filter: drop-shadow(0 1px 1.5px rgba(0,0,0,0.6)); }
    .fp-tip { font-size: 0.74rem; line-height: 1.3; }
    .fp-tip b { display: block; }
    .fp-tip .src { color: #6b7280; font-size: 0.68rem; }
    #legend-layout { margin-top: 8px; padding-top: 6px; border-top: 1px solid #e5e7eb; }
    .legend-swatch { display: inline-block; width: 12px; height: 12px; flex-shrink: 0; }
    .legend-swatch.line { height: 3px; }

    /* Sidebar: project layout block */
    #layout-box {
      margin: 8px 0 4px; padding: 8px 10px; background: #f0f4f8; border: 1px solid #d0d7de; border-radius: 6px;
      font-size: 0.78rem; line-height: 1.4;
    }
    #layout-box .roles { display: flex; flex-wrap: wrap; gap: 4px 8px; margin: 4px 0; }
    #layout-box .roles span { display: inline-flex; align-items: center; gap: 4px; }
    #layout-box button {
      margin-top: 6px; font-size: 0.74rem; padding: 4px 9px; border: 1px solid #1a3a5c; background: white;
      color: #1a3a5c; border-radius: 4px; cursor: pointer; font-family: inherit;
    }
    #layout-box button:hover { background: #1a3a5c; color: white; }
    #layout-box .note { color: #a16207; font-size: 0.72rem; margin-top: 4px; }
    #layout-box .src { color: #555; font-size: 0.72rem; margin-top: 4px; }
    #layout-box .src a { color: #1a3a5c; }
    .zoom-hint { font-size: 0.72rem; color: #6b7280; margin-top: 4px; }
</style>
</head>
<body>

<div id="header">
  <div>
    <h1>Canada EA Atlas</h1>
    <div class="subtitle">Environmental assessments from federal &amp; provincial registries · project documents</div>
  </div>
  <a href="search.html" style="margin-left:auto;color:#9fc3e8;font-size:0.85rem;text-decoration:none">Project Search →</a>
  <a href="wiki.html" style="margin-left:16px;color:#9fc3e8;font-size:0.85rem;text-decoration:none">Corpus Search →</a>
  <a href="predict.html" style="margin-left:16px;color:#9fc3e8;font-size:0.85rem;text-decoration:none">Mitigation Predictor →</a>
</div>

<div id="filters">
  <div class="filter-group">
    <label for="filter-jurisdiction">Jurisdiction</label>
    <select id="filter-jurisdiction">
      <option value="">All</option>
    </select>
  </div>
  <div class="filter-group">
    <label for="filter-type">Sector</label>
    <select id="filter-type">
      <option value="">All</option>
    </select>
  </div>
  <div class="filter-group">
    <label for="filter-year-min">Year</label>
    <select id="filter-year-min">
      <option value="">From</option>
    </select>
    <span style="font-size:0.8rem;color:#888">–</span>
    <select id="filter-year-max">
      <option value="">To</option>
    </select>
  </div>
  <div class="filter-group">
    <label for="filter-docs">Docs</label>
    <select id="filter-docs">
      <option value="">All projects</option>
      <option value="tech">Technical docs only</option>
      <option value="approval">Approval only</option>
    </select>
  </div>
  <div class="filter-group">
    <label for="filter-search">Search</label>
    <input type="text" id="filter-search" placeholder="Project or proponent…" style="width:170px" />
  </div>
  <div class="filter-group">
    <label for="filter-amis" style="cursor:pointer"><input type="checkbox" id="filter-amis" style="vertical-align:-1px" /> Abandoned mines</label>
  </div>
  <div class="filter-group">
    <label for="filter-gaps" style="cursor:pointer" title="Major projects listed in external inventories (NRCan) with no matching record in the EA registries this map harvests"><input type="checkbox" id="filter-gaps" style="vertical-align:-1px" /> Unmatched majors</label>
  </div>
  <span id="count-badge">– projects</span>
</div>

<div id="main">
  <div id="map"></div>

  <div id="sidebar" class="hidden">
    <div id="sidebar-header">
      <h2 id="sidebar-title">Select a project</h2>
      <button id="sidebar-close" title="Close">✕</button>
    </div>
    <div id="sidebar-meta"></div>
    <div id="doc-list"></div>
  </div>
</div>

<!-- Legend (inside map div so it floats over) -->
<div id="legend">
  <h4>Sector</h4>
  <div id="legend-rows"></div>
  <div id="legend-layout" hidden>
    <h4>Project layout</h4>
    <div id="legend-layout-rows"></div>
  </div>
</div>
<script>
// Legend is generated from CATEGORY_META after it is defined below.
window.addEventListener("DOMContentLoaded", () => {
  const el = document.getElementById("legend-rows");
  for (const [key, meta] of Object.entries(CATEGORY_META)) {
    const row = document.createElement("div");
    row.className = "legend-row";
    row.innerHTML = `<span class="legend-icon" style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${meta.colour}"></span> ${meta.label}`;
    el.appendChild(row);
  }
});
</script>

<script>
// ── Map setup ──────────────────────────────────────────────────────────────
const map = L.map("map", {
  center: [56.5, -96],
  zoom: 4,
  maxZoom: 21,
  zoomControl: true,
});

// ── Basemaps ───────────────────────────────────────────────────────────────
// Two keyless Esri services:
//  * "map"    — Light Gray Canvas (native tiles end at z16, upscaled beyond)
//  * "aerial" — World Imagery: Maxar / Earthstar high-resolution orthoimagery,
//               native to z19 across settled Canada (sub-metre pixels, the same
//               class of imagery Google Earth shows), upscaled to z21 so a
//               turbine pad or tailings dam can be inspected up close, with
//               place / boundary and road labels on top.
// "auto" (default) shows the light map for the national overview and switches
// to imagery once the viewer zooms in to a project (IMAGERY_ZOOM).
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
const BASEMAPS = {
  map: {
    label: "Map",
    layers: [
      L.tileLayer(ESRI + "Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
        attribution: 'Powered by <a href="https://www.esri.com/">Esri</a> — Esri, HERE, Garmin, © OpenStreetMap contributors',
        maxZoom: 21, maxNativeZoom: 16,
      }),
      L.tileLayer(ESRI + "Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
        maxZoom: 21, maxNativeZoom: 16, pane: "shadowPane", // labels above tiles, below markers
      }),
    ],
  },
  aerial: {
    label: "Aerial",
    layers: [
      L.tileLayer(ESRI + "World_Imagery/MapServer/tile/{z}/{y}/{x}", {
        attribution: 'Imagery © Esri — Maxar, Earthstar Geographics, and the GIS User Community',
        maxZoom: 21, maxNativeZoom: 19,
      }),
      L.tileLayer(ESRI + "Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}", {
        maxZoom: 21, maxNativeZoom: 19, pane: "shadowPane", opacity: 0.9,
      }),
      L.tileLayer(ESRI + "Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {
        maxZoom: 21, maxNativeZoom: 19, pane: "shadowPane",
      }),
    ],
  },
};
const IMAGERY_ZOOM = 12;     // "auto" flips to aerial at this zoom
let basemapMode = "auto";    // "auto" | "map" | "aerial"
try { basemapMode = localStorage.getItem("ea-basemap") || "auto"; } catch (e) {}
let basemapShown = null;

function wantedBasemap() {
  if (basemapMode !== "auto") return basemapMode;
  return map.getZoom() >= IMAGERY_ZOOM ? "aerial" : "map";
}
function applyBasemap() {
  const want = wantedBasemap();
  if (want === basemapShown) return;
  if (basemapShown) BASEMAPS[basemapShown].layers.forEach(l => map.removeLayer(l));
  BASEMAPS[want].layers.forEach(l => l.addTo(map));
  basemapShown = want;
  document.getElementById("legend").style.background = want === "aerial" ? "rgba(255,255,255,0.92)" : "white";
}
function setBasemapMode(mode) {
  basemapMode = mode;
  try { localStorage.setItem("ea-basemap", mode); } catch (e) {}
  document.querySelectorAll(".basemap-ctl button").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  applyBasemap();
}
const BasemapControl = L.Control.extend({
  onAdd() {
    const div = L.DomUtil.create("div", "basemap-ctl leaflet-bar");
    for (const [mode, label] of [["map", "Map"], ["aerial", "Aerial"], ["auto", "Auto"]]) {
      const b = L.DomUtil.create("button", mode === basemapMode ? "active" : "", div);
      b.textContent = label;
      b.dataset.mode = mode;
      b.title = mode === "auto" ? `Light map when zoomed out, aerial imagery from zoom ${IMAGERY_ZOOM}` :
                mode === "aerial" ? "High-resolution aerial imagery (Esri World Imagery)" : "Light grey reference map";
      L.DomEvent.on(b, "click", e => { L.DomEvent.stop(e); setBasemapMode(mode); });
    }
    L.DomEvent.disableClickPropagation(div);
    return div;
  },
});
map.addControl(new BasemapControl({ position: "topright" }));
applyBasemap();
map.on("zoomend", applyBasemap);

// ── SVG icon paths ─────────────────────────────────────────────────────────
// Wind turbine: tapered tower + 3 blades at 120° intervals + hub
const SVG_WIND = (c, op) => `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" width="38" height="38" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35))">
  <circle cx="19" cy="19" r="18" fill="white" opacity="${op}" stroke="${c}" stroke-width="2"/>
  <!-- tapered tower -->
  <polygon points="18.2,18 19.8,18 21,33 17,33" fill="${c}" opacity="${op}"/>
  <!-- 3 blades at 120° each — same teardrop shape, rotated around hub (19,18) -->
  <path d="M19,18 C17.8,15 17.5,11 19,8 C20.5,11 20.2,15 19,18Z" fill="${c}" opacity="${op}"/>
  <path d="M19,18 C17.8,15 17.5,11 19,8 C20.5,11 20.2,15 19,18Z" fill="${c}" opacity="${op}" transform="rotate(120,19,18)"/>
  <path d="M19,18 C17.8,15 17.5,11 19,8 C20.5,11 20.2,15 19,18Z" fill="${c}" opacity="${op}" transform="rotate(240,19,18)"/>
  <!-- hub: white fill covers blade roots and tower top cleanly -->
  <circle cx="19" cy="18" r="2.5" fill="white" opacity="${op}" stroke="${c}" stroke-width="1.8"/>
</svg>`;

// Solar panel array: sun above stylised panels
const SVG_SOLAR = (c, op) => `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" width="38" height="38" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35))">
  <circle cx="19" cy="19" r="18" fill="white" opacity="${op}" stroke="${c}" stroke-width="2"/>
  <!-- sun circle -->
  <circle cx="19" cy="13" r="4.5" fill="${c}" opacity="${op}"/>
  <!-- sun rays -->
  <g stroke="${c}" stroke-width="1.8" stroke-linecap="round" opacity="${op}">
    <line x1="19" y1="6"  x2="19" y2="4.5"/>
    <line x1="19" y1="20" x2="19" y2="21.5"/>
    <line x1="12" y1="13" x2="10.5" y2="13"/>
    <line x1="26" y1="13" x2="27.5" y2="13"/>
    <line x1="14" y1="8"  x2="13"   y2="7"/>
    <line x1="24" y1="8"  x2="25"   y2="7"/>
    <line x1="14" y1="18" x2="13"   y2="19"/>
    <line x1="24" y1="18" x2="25"   y2="19"/>
  </g>
  <!-- solar panel grid -->
  <g opacity="${op}">
    <rect x="9"  y="24" width="8"  height="6" rx="1" fill="${c}"/>
    <rect x="18.5" y="24" width="4" height="6" rx="1" fill="${c}"/>
    <rect x="24" y="24" width="5"  height="6" rx="1" fill="${c}"/>
    <line x1="11" y1="24" x2="11" y2="30" stroke="white" stroke-width="0.8"/>
    <line x1="13" y1="24" x2="13" y2="30" stroke="white" stroke-width="0.8"/>
    <line x1="15" y1="24" x2="15" y2="30" stroke="white" stroke-width="0.8"/>
    <line x1="9"  y1="27" x2="17" y2="27" stroke="white" stroke-width="0.8"/>
  </g>
</svg>`;

// Biogas: flame inside droplet shape
const SVG_BIOGAS = (c, op) => `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" width="38" height="38" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35))">
  <circle cx="19" cy="19" r="18" fill="white" opacity="${op}" stroke="${c}" stroke-width="2"/>
  <!-- flame -->
  <path d="M19 8
    C15 12 11 15 13 21
    C14 24 16 25 15 27
    C13 25 13 21 15 19
    C12 21 10 25 13 28
    C15 31 17 32 19 32
    C21 32 23 31 25 28
    C28 25 26 21 23 19
    C25 21 25 25 23 27
    C22 25 24 24 25 21
    C27 15 23 12 19 8Z"
    fill="${c}" opacity="${op}"/>
  <!-- inner highlight -->
  <path d="M19 14 C17 17 16 19 17 22 C18 24 19 24 19 14Z"
    fill="white" opacity="${op * 0.35}"/>
</svg>`;

// Transmission: lattice pylon with a crossarm and conductors
const SVG_TOWER = (c, op) => `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" width="38" height="38" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35))">
  <circle cx="19" cy="19" r="18" fill="white" opacity="${op}" stroke="${c}" stroke-width="2"/>
  <g stroke="${c}" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="${op}">
    <path d="M15 32 L18 9 L20 9 L23 32"/>
    <path d="M16.2 24 L21.8 24 M15.6 28 L22.4 28 M17 17 L21 17"/>
    <path d="M10 13 L28 13"/>
    <path d="M12 13 L14 19 M26 13 L24 19"/>
    <path d="M16.6 13 L21.4 17 M21.4 13 L16.6 17"/>
  </g>
  <circle cx="10" cy="13" r="1.4" fill="${c}" opacity="${op}"/><circle cx="28" cy="13" r="1.4" fill="${c}" opacity="${op}"/>
</svg>`;

const CATEGORY_META = {
  wind:         { colour: "#2563eb", label: "Wind" },
  solar:        { colour: "#d97706", label: "Solar" },
  biogas:       { colour: "#16a34a", label: "Biogas / biomass" },
  hydro:        { colour: "#0891b2", label: "Hydro / dams" },
  mining:       { colour: "#92400e", label: "Mining" },
  oil_gas:      { colour: "#57534e", label: "Oil & gas" },
  nuclear:      { colour: "#ca8a04", label: "Nuclear" },
  transmission: { colour: "#7c3aed", label: "Transmission" },
  energy_other: { colour: "#a21caf", label: "Other energy" },
  transport:    { colour: "#db2777", label: "Transport" },
  water:        { colour: "#0d9488", label: "Water / marine" },
  industrial:   { colour: "#4b5563", label: "Industrial" },
  waste:        { colour: "#65a30d", label: "Waste" },
  agriculture:  { colour: "#84cc16", label: "Agriculture" },
  tourism:      { colour: "#f472b6", label: "Tourism" },
  other:        { colour: "#6b7280", label: "Other" },
};

function makeIcon(feature, selected) {
  const cat = feature.properties.category || "other";
  const has = feature.properties.has_tech_docs || feature.properties.doc_count > 0;
  const op  = has ? 1 : 0.75;

  const meta = CATEGORY_META[cat] || CATEGORY_META.other;
  const c = selected ? "#dc2626" : meta.colour;

  // approximate (gazetteer-geocoded) locations render with a dashed ring
  const approx = feature.properties.geocode === "approximate";
  const dash = approx ? ' stroke-dasharray="4 3"' : "";

  let svgStr;
  if (cat === "wind")        svgStr = SVG_WIND(c, op);
  else if (cat === "solar")  svgStr = SVG_SOLAR(c, op);
  else if (cat === "biogas") svgStr = SVG_BIOGAS(c, op);
  else if (cat === "transmission") svgStr = SVG_TOWER(c, op);
  else {
    // generic marker: coloured circle with first letter of category
    const letter = meta.label.charAt(0);
    svgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" width="38" height="38" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35))">
      <circle cx="19" cy="19" r="17" fill="white" opacity="${op}" stroke="${c}" stroke-width="2"${dash}/>
      <circle cx="19" cy="19" r="12" fill="${c}" opacity="${op * (approx ? 0.8 : 1)}"/>
      <text x="19" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="white">${letter}</text>
    </svg>`;
  }

  return L.divIcon({
    html: svgStr,
    className: "",
    iconSize: [38, 38],
    iconAnchor: [19, 19],
    popupAnchor: [0, -20],
  });
}

// ── Cluster group ──────────────────────────────────────────────────────────
const cluster = L.markerClusterGroup({
  maxClusterRadius: 40,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  iconCreateFunction(c) {
    const n = c.getChildCount();
    const size = n > 50 ? 44 : n > 20 ? 38 : 32;
    return L.divIcon({
      html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:#1a3a5c;color:white;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:600;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.3)">${n}</div>`,
      className: "",
      iconSize: [size, size],
      iconAnchor: [size/2, size/2],
    });
  },
});
map.addLayer(cluster);

// ── Project layouts (footprints) ───────────────────────────────────────────
// Features that carry `footprint_path` have a per-project GeoJSON under
// data/footprints/<pid>.json: turbines, inverters, substations, pits, dams,
// lines... each with a `role` (scripts/footprints_common.py ROLES). They are
// lazy-loaded for every project in view once zoomed to FOOTPRINT_ZOOM, and
// for the selected project from SELECTED_FOOTPRINT_ZOOM.
const FOOTPRINT_ZOOM = 11;
const SELECTED_FOOTPRINT_ZOOM = 9;
const MAX_FOOTPRINTS_IN_VIEW = 80;
const FOOTPRINT_STYLES = {
  turbine:           { label: "Wind turbine",             kind: "turbine", color: "#1e3a8a" },
  inverter:          { label: "Inverter / power station", kind: "point", color: "#d97706", shape: "square",  r: 5 },
  transformer:       { label: "Transformer",              kind: "point", color: "#b45309", shape: "diamond", r: 5 },
  substation:        { label: "Substation / switchyard",  kind: "point", color: "#7c3aed", shape: "square",  r: 7 },
  tracker:           { label: "Solar tracker drive",      kind: "point", color: "#f59e0b", shape: "circle",  r: 3 },
  met_tower:         { label: "Met tower",                kind: "point", color: "#0891b2", shape: "triangle", r: 5 },
  generator:         { label: "Generating unit",          kind: "point", color: "#16a34a", shape: "circle",  r: 5 },
  crossing:          { label: "Watercourse crossing",     kind: "point", color: "#0d9488", shape: "circle",  r: 4 },
  shaft:             { label: "Shaft / portal",           kind: "point", color: "#92400e", shape: "square",  r: 5 },
  well:              { label: "Well / wellpad",           kind: "point", color: "#57534e", shape: "circle",  r: 4 },
  dam:               { label: "Dam structure",            kind: "point", color: "#0e7490", shape: "square",  r: 6 },
  powerhouse:        { label: "Powerhouse",               kind: "point", color: "#0891b2", shape: "square",  r: 6 },
  transmission_line: { label: "Transmission line",        kind: "line", color: "#7c3aed", weight: 3 },
  collector_line:    { label: "Collector line",           kind: "line", color: "#a78bfa", weight: 2, dash: "6 4" },
  pipeline:          { label: "Pipeline",                 kind: "line", color: "#57534e", weight: 3 },
  access_road:       { label: "Access road",              kind: "line", color: "#fafaf9", weight: 2, dash: "2 5" },
  rail:              { label: "Rail",                     kind: "line", color: "#374151", weight: 2, dash: "8 4" },
  penstock:          { label: "Penstock / canal",         kind: "line", color: "#0891b2", weight: 3, dash: "10 4" },
  footprint:         { label: "Project footprint",        kind: "poly", color: "#dc2626", fill: 0.06, dash: "8 5", weight: 2 },
  solar_array:       { label: "Solar array",              kind: "poly", color: "#d97706", fill: 0.3 },
  pit:               { label: "Open pit / quarry",        kind: "poly", color: "#92400e", fill: 0.3 },
  tailings:          { label: "Tailings storage",         kind: "poly", color: "#b91c1c", fill: 0.3 },
  waste_rock:        { label: "Waste rock / stockpile",   kind: "poly", color: "#a16207", fill: 0.3 },
  plant:             { label: "Plant site",               kind: "poly", color: "#4b5563", fill: 0.3 },
  reservoir:         { label: "Reservoir",                kind: "poly", color: "#0891b2", fill: 0.3 },
  landfill:          { label: "Landfill / disposal cell", kind: "poly", color: "#65a30d", fill: 0.3 },
  building:          { label: "Building",                 kind: "poly", color: "#6b7280", fill: 0.4 },
  other:             { label: "Other element",            kind: "point", color: "#6b7280", shape: "circle", r: 4 },
};
const FOOTPRINT_SOURCE_LABELS = {
  ontario_rea: "Renewable Energy Approval — equipment coordinates schedule (Ontario MECP)",
  cwtd: "Canadian Wind Turbine Database (NRCan, Open Government Licence – Canada)",
  osm: "© OpenStreetMap contributors (ODbL)",
  gis: "Proponent geospatial data filed with the registry",
};

const footprintData  = {};   // pid -> Promise<FeatureCollection|null>
const footprintShown = {};   // pid -> L.Layer currently on the map
let footprintWanted  = new Set();
let visibleFeatures  = [];   // features passing the current filters (set by applyFilters)

function pidOf(f) {
  const fp = f.properties.footprint_path;
  return fp ? fp.replace(/^.*\//, "").replace(/\.json$/, "") : null;
}
function bboxBounds(b) { return L.latLngBounds([[b[1], b[0]], [b[3], b[2]]]); }

function loadFootprint(f) {
  const pid = pidOf(f);
  if (!pid) return Promise.resolve(null);
  if (!footprintData[pid]) {
    footprintData[pid] = fetch(f.properties.footprint_path)
      .then(r => r.ok ? r.json() : null)
      .catch(() => null);
  }
  return footprintData[pid];
}

// Small rotor glyph for turbines (white blades, dark outline) — legible on imagery.
function turbineIcon(color, size) {
  const s = size || 22;
  return L.divIcon({
    className: "fp-turbine",
    iconSize: [s, s], iconAnchor: [s / 2, s / 2],
    html: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="${s}" height="${s}">
      <g fill="white" stroke="${color}" stroke-width="1.4" stroke-linejoin="round">
        <path d="M12 12 C10.6 8.5 10.4 4.5 12 1.5 C13.6 4.5 13.4 8.5 12 12Z"/>
        <path d="M12 12 C10.6 8.5 10.4 4.5 12 1.5 C13.6 4.5 13.4 8.5 12 12Z" transform="rotate(120 12 12)"/>
        <path d="M12 12 C10.6 8.5 10.4 4.5 12 1.5 C13.6 4.5 13.4 8.5 12 12Z" transform="rotate(240 12 12)"/>
      </g>
      <circle cx="12" cy="12" r="2.2" fill="${color}" stroke="white" stroke-width="1"/>
    </svg>`,
  });
}
function shapeIcon(st) {
  const r = st.r || 5, s = r * 2 + 4, c = s / 2;
  let body;
  if (st.shape === "square")        body = `<rect x="${c - r}" y="${c - r}" width="${2 * r}" height="${2 * r}" rx="1"/>`;
  else if (st.shape === "diamond")  body = `<rect x="${c - r}" y="${c - r}" width="${2 * r}" height="${2 * r}" transform="rotate(45 ${c} ${c})"/>`;
  else if (st.shape === "triangle") body = `<polygon points="${c},${c - r} ${c + r},${c + r} ${c - r},${c + r}"/>`;
  else                              body = `<circle cx="${c}" cy="${c}" r="${r}"/>`;
  return L.divIcon({
    className: "", iconSize: [s, s], iconAnchor: [c, c],
    html: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" style="filter:drop-shadow(0 1px 1px rgba(0,0,0,0.5))">
      <g fill="${st.color}" stroke="white" stroke-width="1.5">${body}</g></svg>`,
  });
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }

function footprintTooltip(el, fc) {
  const p = el.properties || {};
  const st = FOOTPRINT_STYLES[p.role] || FOOTPRINT_STYLES.other;
  const bits = [];
  if (p.description) bits.push(esc(p.description));
  if (p.sound_power_dba) bits.push(`${p.sound_power_dba} dBA sound power`);
  if (p.capacity_kw) bits.push(`${p.capacity_kw} kW`);
  if (p.hub_height_m) bits.push(`hub ${p.hub_height_m} m`);
  if (p.rotor_diameter_m) bits.push(`rotor ${p.rotor_diameter_m} m`);
  if (p.name && p.name !== p.label) bits.push(esc(p.name));
  const src = FOOTPRINT_SOURCE_LABELS[p.source] || p.source || "";
  return `<div class="fp-tip"><b>${esc(p.label ? `${st.label} ${p.label}` : st.label)}</b>${bits.join(" · ")}` +
    `<span class="src">${esc((fc.properties || {}).name || "")}${src ? " · " + esc(src) : ""}</span></div>`;
}

function buildFootprintLayer(fc) {
  return L.geoJSON(fc, {
    pointToLayer(el, latlng) {
      const st = FOOTPRINT_STYLES[(el.properties || {}).role] || FOOTPRINT_STYLES.other;
      if (st.kind === "turbine") return L.marker(latlng, { icon: turbineIcon(st.color), interactive: true, keyboard: false });
      return L.marker(latlng, { icon: shapeIcon(st), keyboard: false });
    },
    style(el) {
      const st = FOOTPRINT_STYLES[(el.properties || {}).role] || FOOTPRINT_STYLES.other;
      return { color: st.color, weight: st.weight || 2, opacity: 0.95, dashArray: st.dash || null,
               fillColor: st.color, fillOpacity: st.kind === "poly" ? (st.fill == null ? 0.25 : st.fill) : 0 };
    },
    onEachFeature(el, layer) {
      layer.bindTooltip(footprintTooltip(el, fc), { sticky: true, direction: "top", opacity: 0.95 });
    },
  });
}

function refreshFootprints() {
  const z = map.getZoom();
  const view = map.getBounds().pad(0.25);
  const want = new Map();
  if (z >= FOOTPRINT_ZOOM) {
    for (const f of visibleFeatures) {
      const b = f.properties.footprint_bbox;
      if (!b || !view.intersects(bboxBounds(b))) continue;
      want.set(pidOf(f), f);
      if (want.size >= MAX_FOOTPRINTS_IN_VIEW) break;
    }
  }
  if (activeMarker && activeMarker.feature.properties.footprint_path && z >= SELECTED_FOOTPRINT_ZOOM) {
    want.set(pidOf(activeMarker.feature), activeMarker.feature);
  }
  footprintWanted = new Set(want.keys());
  for (const pid of Object.keys(footprintShown)) {
    if (!footprintWanted.has(pid)) { map.removeLayer(footprintShown[pid]); delete footprintShown[pid]; }
  }
  want.forEach((f, pid) => {
    if (footprintShown[pid]) return;
    loadFootprint(f).then(fc => {
      if (!fc || !footprintWanted.has(pid) || footprintShown[pid]) return;
      footprintShown[pid] = buildFootprintLayer(fc).addTo(map);
      updateLayoutLegend();
    });
  });
  updateLayoutLegend();
}
map.on("moveend", refreshFootprints);

function updateLayoutLegend() {
  const roles = new Set();
  for (const pid of Object.keys(footprintShown)) {
    footprintShown[pid].eachLayer(l => { if (l.feature) roles.add(l.feature.properties.role || "other"); });
  }
  const box = document.getElementById("legend-layout");
  const rows = document.getElementById("legend-layout-rows");
  if (!roles.size) { box.hidden = true; rows.innerHTML = ""; return; }
  rows.innerHTML = "";
  for (const role of Object.keys(FOOTPRINT_STYLES)) {
    if (!roles.has(role)) continue;
    const st = FOOTPRINT_STYLES[role];
    let sw;
    if (st.kind === "turbine") sw = turbineIcon(st.color, 14).options.html;
    else if (st.kind === "line") sw = `<span class="legend-swatch line" style="background:${st.color};${st.dash ? "border-top:2px dashed " + st.color + ";background:none;height:0" : ""}"></span>`;
    else if (st.kind === "poly") sw = `<span class="legend-swatch" style="border:2px ${st.dash ? "dashed" : "solid"} ${st.color};background:${st.color}33"></span>`;
    else sw = shapeIcon(st).options.html;
    const row = document.createElement("div");
    row.className = "legend-row";
    row.innerHTML = `<span class="legend-icon" style="display:inline-flex;width:14px;justify-content:center">${sw}</span> ${st.label}`;
    rows.appendChild(row);
  }
  box.hidden = false;
}

// Documents that are maps, figures, site plans or GIS data get hoisted into a
// "Maps & drawings" section (mirror of scripts/find_map_documents.py rules).
const MAP_DOC_RX = /\b(shapefiles?|kmz|kml|geodatabase|geospatial|gis (?:data|files?)|site plans?|plot plans?|general arrangements?|layouts?|footprints?|location maps?|project location|key maps?|study area maps?|(?:overview|vicinity|index) maps?|figures?|fig\.|maps?|cartes?|mapbook|plan d.(?:ensemble|implantation)|localisation|alignment sheets?|orthophoto|aerial (?:photo|image)|turbine (?:locations?|siting))\b/i;
const NOT_MAP_RX = /\b(request(?:ing)?|response to|letter|correspondence|comments? on|email|courriel|meeting|minutes|agenda|presentation|news release|road ?map|mapping process|figured)\b/i;
function isMapDoc(d) {
  const t = d.title || "";
  if (/\.(kmz|kml|shp|geojson|gpkg)(\?|$)/i.test(d.url || "")) return true;
  return MAP_DOC_RX.test(t) && !NOT_MAP_RX.test(t);
}
function mapDocsSection(docs) {
  const maps = (docs || []).filter(isMapDoc);
  if (!maps.length) return null;
  const sec = document.createElement("div");
  sec.className = "doc-section";
  sec.innerHTML = `<div class="doc-section-title">Maps, figures &amp; site plans (${maps.length})</div>`;
  const shown = maps.slice(0, 60);
  for (const doc of shown) {
    const a = document.createElement("a");
    a.className = "doc-link doc-map";
    a.href = doc.url; a.target = "_blank"; a.rel = "noopener";
    const title = doc.title && doc.title.length > 80 ? doc.title.substring(0, 78) + "…" : (doc.title || "Map");
    a.textContent = doc.date ? `${title} (${doc.date})` : title;
    sec.appendChild(a);
  }
  if (maps.length > shown.length) {
    const more = document.createElement("p");
    more.className = "no-docs";
    more.textContent = `+${maps.length - shown.length} more in the sections below`;
    sec.appendChild(more);
  }
  return sec;
}

// Sidebar block describing the recovered layout, with a zoom-to button.
function layoutBoxHtml(p) {
  if (!p.footprint_path) return "";
  const roles = p.footprint_roles || {};
  const parts = Object.keys(FOOTPRINT_STYLES).filter(r => roles[r]).map(r => {
    const st = FOOTPRINT_STYLES[r];
    const n = roles[r];
    const lbl = st.label.split(" / ")[0].toLowerCase();
    return `<span>${n} ${lbl}${n === 1 ? "" : "s"}</span>`;
  });
  const srcs = (p.footprint_sources || []).map(s => FOOTPRINT_SOURCE_LABELS[s] || s);
  const z = map.getZoom();
  return `<div id="layout-box">
    <strong>Project layout</strong> — ${p.footprint_n} design element${p.footprint_n === 1 ? "" : "s"} recovered from the record
    <div class="roles">${parts.join("")}</div>
    <div class="src">Source: ${esc(srcs.join("; "))}${p.footprint_confidence && p.footprint_confidence !== "high" ? ` · confidence ${p.footprint_confidence}` : ""}</div>
    <div class="note" id="layout-note"></div>
    <button id="layout-zoom">Zoom to layout</button>
    ${z < SELECTED_FOOTPRINT_ZOOM ? `<div class="zoom-hint">Zoom in (or use the button) to see the elements on aerial imagery.</div>` : ""}
  </div>`;
}
function wireLayoutBox(feature) {
  const btn = document.getElementById("layout-zoom");
  if (!btn) return;
  const p = feature.properties;
  btn.addEventListener("click", () => {
    map.fitBounds(bboxBounds(p.footprint_bbox), { padding: [30, 30], maxZoom: 15 });
  });
  loadFootprint(feature).then(fc => {
    const note = document.getElementById("layout-note");
    if (!fc || !note || !activeMarker || activeMarker.feature !== feature) return;
    const fp = fc.properties || {};
    const bits = [];
    if (fp.notes) bits.push(esc(fp.notes));
    const docs = (fp.sources || []).filter(s => s.url);
    if (docs.length) {
      bits.push("From: " + docs.slice(0, 3).map(s =>
        `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.doc_id)}</a>${s.utm_zone ? ` (UTM ${s.utm_zone}N)` : ""}`).join(", "));
    }
    if (fp.license) bits.push(esc(fp.license));
    note.innerHTML = bits.join("<br>");
    note.className = fp.notes ? "note" : "src";
  });
}

// ── Sidebar logic ──────────────────────────────────────────────────────────
const sidebar      = document.getElementById("sidebar");
const sidebarTitle = document.getElementById("sidebar-title");
const sidebarMeta  = document.getElementById("sidebar-meta");
const docList      = document.getElementById("doc-list");

document.getElementById("sidebar-close").addEventListener("click", () => {
  sidebar.classList.add("hidden");
  if (activeMarker) { activeMarker.setIcon(makeIcon(activeMarker.feature, false)); activeMarker = null; }
  refreshFootprints();
});

let activeMarker = null;

function openSidebar(feature, marker) {
  const p = feature.properties;

  // Reset previous active marker
  if (activeMarker && activeMarker !== marker) {
    activeMarker.setIcon(makeIcon(activeMarker.feature, false));
  }
  activeMarker = marker;
  marker.setIcon(makeIcon(feature, true));  // purple = selected

  sidebarTitle.textContent = p.name;
  sidebar.classList.remove("hidden");

  // Meta section
  const catMeta = CATEGORY_META[p.category || "other"] || CATEGORY_META.other;
  const nth = northeyByKey[p.jurisdiction + "||" + p.name];
  const cap = p.capacity_mw ? `${p.capacity_mw} MW` : null;
  const turbines = p.num_turbines ? ` · ${p.num_turbines} turbines` : "";
  const panels   = p.num_panels   ? ` · ${p.num_panels} panels`   : "";
  const location = [p.location, p.municipality, p.county, p.region]
    .filter(Boolean).join(", ") || "—";

  const rows = [
    ["Jurisdiction", p.jurisdiction],
    ["Sector", catMeta.label],
    ["Status", p.status],
    ["EA type", p.ea_type],
    ["EA phase", p.ea_phase],
    ["Decision", p.decision],
    ["Proponent", p.proponent],
    cap ? ["Capacity", `${cap}${turbines}${panels}`] : null,
    ["Approved", p.approval_date],
    ["Location", location],
    p.rea_number ? ["REA Number", p.rea_number] : null,
    p.reference_number ? ["EA reference #", p.reference_number] : null,
    p.decision_date ? ["Decision date", p.decision_date] : null,
    p.doc_count ? ["Documents", `${p.doc_count} total`] : null,
    p.updated ? ["Updated", p.updated] : null,
    p.note ? ["Note", p.note] : null,
    nth ? ["Northey (2023)", `Landmark ${nth.regime} case, cited as of ${nth.y}`] : null,
  ].filter(r => r && r[1]);

  sidebarMeta.innerHTML = `
    <div style="margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="type-badge" style="background:${catMeta.colour}22;color:${catMeta.colour}">${catMeta.label}</span>
      ${nth ? `<span class="type-badge" title="Cited as a landmark case in Rodney Northey, A Guide to Canada's Impact Assessment Act (2023)" style="background:#7c3aed22;color:#6d28d9">★ Landmark case · ${nth.regime}</span>` : ""}
      ${p.procurement ? `<span style="font-size:0.72rem;color:#666">${p.procurement}</span>` : ""}
    </div>
    <div class="meta-grid">
      ${rows.map(([k, v]) => `<div class="meta-item"><label>${k}</label><span>${v}</span></div>`).join("")}
    </div>
    ${p.registry_url ? `<div style="margin-top:10px"><a href="${p.registry_url}" target="_blank" rel="noopener" style="font-size:0.8rem;color:#1a3a5c;font-weight:600">${p.archived ? "Open archived registry record" : "Open registry page"} ↗</a></div>` : ""}
    ${p.bape_url ? `<div style="margin-top:4px"><a href="${p.bape_url}" target="_blank" rel="noopener" style="font-size:0.8rem;color:#1a3a5c;font-weight:600">BAPE dossier (documents, hearings) ↗</a></div>` : ""}
    ${p.proponent_url ? `<div style="margin-top:4px"><a href="${p.proponent_url}" target="_blank" rel="noopener" style="font-size:0.8rem;color:#1a3a5c;font-weight:600">Proponent's project page ↗</a></div>` : ""}
    ${p.archived ? `<p style="margin-top:8px;font-size:0.72rem;color:#666">Archived record — assessed under CEAA 1992 and no longer served by the live registry; links point at the Agency's archive.</p>` : ""}
    ${p.geocode === "approximate" ? `<p style="margin-top:8px;font-size:0.72rem;color:#a16207">⚠ Approximate location — pinned to the nearest named place (${(p.geocode_match || "").replace("name:", "")}). The registry does not publish coordinates for this project.</p>` : ""}
    ${p.description ? `<p style="margin-top:8px;font-size:0.78rem;color:#555;line-height:1.4">${p.description}</p>` : ""}`;

  // Project layout (footprint) block + show it on the map right away
  sidebarMeta.insertAdjacentHTML("beforeend", layoutBoxHtml(p));
  wireLayoutBox(feature);
  refreshFootprints();

  // Document sections
  docList.innerHTML = "";
  if (!p.doc_sections || p.doc_sections.length === 0) {
    if (p.docs_path) {
      // Lazy-load the per-project document catalogue (BC etc.)
      docList.innerHTML = `<p class="no-docs">Loading ${p.doc_count || ""} documents…</p>`;
      fetch(p.docs_path)
        .then(r => r.json())
        .then(cat => {
          if (activeMarker && activeMarker.feature.properties !== p) return; // stale click
          docList.innerHTML = "";
          const mapSec = mapDocsSection(cat.docs);
          if (mapSec) docList.appendChild(mapSec);
          // Group by category when the catalogue carries one (Class EA
          // records organised by study; registry catalogues by document type)
          const groups = new Map();
          const grouped = cat.docs.some(d => d.category);
          for (const doc of cat.docs) {
            const g = grouped ? (doc.category || "Other") : `Registry documents (${cat.docs.length})`;
            if (!groups.has(g)) groups.set(g, []);
            groups.get(g).push(doc);
          }
          for (const [gname, gdocs] of groups) {
          const sec = document.createElement("div");
          sec.className = "doc-section";
          sec.innerHTML = `<div class="doc-section-title">${gname}${grouped ? ` (${gdocs.length})` : ""}</div>`;
          for (const doc of gdocs) {
            const a = document.createElement("a");
            a.className = "doc-link";
            a.href = doc.url;
            a.target = "_blank";
            a.rel = "noopener";
            const title = doc.title && doc.title.length > 80
              ? doc.title.substring(0, 78) + "…" : (doc.title || "Document");
            const label = doc.code ? `${doc.code} · ${title}` : title;
            a.textContent = doc.date ? `${label} (${doc.date})` : label;
            sec.appendChild(a);
            if (doc.archive_url) {
              const b = document.createElement("a");
              b.className = "doc-link doc-archive";
              b.href = doc.archive_url;
              b.target = "_blank";
              b.rel = "noopener";
              b.title = "Permanent copy in the Canada EA Atlas archive";
              b.textContent = "archived copy ↗";
              sec.appendChild(b);
            }
          }
          docList.appendChild(sec);
          }
        })
        .catch(() => {
          docList.innerHTML = `<p class="no-docs">Could not load documents — use the registry page link above.</p>`;
        });
      return;
    }
    docList.innerHTML = `<p class="no-docs">${p.registry_url
      ? "Documents are available on this project's registry page."
      : "No documents found for this project."}</p>`;
    return;
  }

  const mapSecAll = mapDocsSection(p.doc_sections.flatMap(s => s.docs || []));
  if (mapSecAll) docList.appendChild(mapSecAll);

  for (const section of p.doc_sections) {
    const sec = document.createElement("div");
    sec.className = "doc-section";
    sec.innerHTML = `<div class="doc-section-title">${section.label} (${section.docs.length})</div>`;

    for (const doc of section.docs) {
      const a = document.createElement("a");
      a.className = "doc-link";
      a.href = doc.url;
      a.target = "_blank";
      a.rel = "noopener";
      // Truncate long titles
      const title = doc.title && doc.title.length > 80
        ? doc.title.substring(0, 78) + "…"
        : (doc.title || doc.label);
      a.textContent = title;
      sec.appendChild(a);
    }
    docList.appendChild(sec);
  }
}

// ── Load GeoJSON ───────────────────────────────────────────────────────────
let allFeatures = [];
let allMarkers  = [];  // parallel array to allFeatures

// Northey landmark cases (data/api/northey.json), keyed by jurisdiction||name —
// the same identity the stable project id is hashed from.
let northeyByKey = {};
fetch("data/api/northey.json")
  .then(r => r.ok ? r.json() : null)
  .then(d => { if (d) for (const x of d.projects) northeyByKey[x.j + "||" + x.n] = x; })
  .catch(() => {});

fetch("data/projects_canada.geojson")
  .then(r => r.ok ? r.json() : fetch("projects.geojson").then(r2 => r2.json()))
  .then(data => {
    allFeatures = data.features;
    buildYearFilters();
    buildDynamicFilters();
    applyFilters();
  })
  .catch(err => console.error("Failed to load GeoJSON:", err));

function buildYearFilters() {
  const years = [...new Set(allFeatures.map(f => f.properties.approval_year).filter(Boolean))].sort();
  const minSel = document.getElementById("filter-year-min");
  const maxSel = document.getElementById("filter-year-max");
  years.forEach(y => {
    minSel.add(new Option(y, y));
    maxSel.add(new Option(y, y));
  });
}

function buildDynamicFilters() {
  const jurs = [...new Set(allFeatures.map(f => f.properties.jurisdiction).filter(Boolean))].sort();
  const jSel = document.getElementById("filter-jurisdiction");
  jurs.forEach(j => jSel.add(new Option(j, j)));

  const cats = [...new Set(allFeatures.map(f => f.properties.category).filter(Boolean))];
  const order = Object.keys(CATEGORY_META);
  cats.sort((a, b) => order.indexOf(a) - order.indexOf(b));
  const tSel = document.getElementById("filter-type");
  cats.forEach(c => tSel.add(new Option((CATEGORY_META[c] || {}).label || c, c)));
}

function applyFilters() {
  const jurVal    = document.getElementById("filter-jurisdiction").value;
  const typeVal   = document.getElementById("filter-type").value;
  const yearMin   = parseInt(document.getElementById("filter-year-min").value) || 0;
  const yearMax   = parseInt(document.getElementById("filter-year-max").value) || 9999;
  const docsVal   = document.getElementById("filter-docs").value;
  const search    = document.getElementById("filter-search").value.trim().toLowerCase();

  const showAmis = document.getElementById("filter-amis").checked;
  const showGaps = document.getElementById("filter-gaps").checked;
  const filtered = allFeatures.filter(f => {
    const p = f.properties;
    // Abandoned mines are a reference layer: hidden unless toggled on or
    // explicitly selected in the jurisdiction filter
    if (p.source === "on_amis" && !showAmis && jurVal !== p.jurisdiction) return false;
    // Unmatched inventory majors (gap overlay): same opt-in treatment
    if (p.source === "nrcan_gap" && !showGaps && jurVal !== p.jurisdiction) return false;
    if (jurVal && p.jurisdiction !== jurVal) return false;
    if (typeVal && p.category !== typeVal) return false;
    if (yearMin && (p.approval_year || 0) < yearMin) return false;
    if (yearMax < 9999 && (p.approval_year || 0) > yearMax) return false;
    if (docsVal === "tech"     && !p.has_tech_docs) return false;
    if (docsVal === "approval" &&  p.has_tech_docs) return false;
    if (search) {
      const haystack = `${p.name} ${p.proponent || ""} ${p.municipality || ""} ${p.county || ""} ${p.location || ""} ${p.jurisdiction || ""}`.toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });

  // Rebuild cluster layer
  cluster.clearLayers();
  allMarkers = [];
  let unmapped = 0;

  filtered.forEach(feature => {
    if (!feature.geometry || !feature.geometry.coordinates) { unmapped++; return; }
    const [lng, lat] = feature.geometry.coordinates;
    const marker = L.marker([lat, lng], { icon: makeIcon(feature, false) });
    marker.feature = feature;
    marker.on("click", () => openSidebar(feature, marker));
    allMarkers.push(marker);
    cluster.addLayer(marker);
  });

  const badge = `${filtered.length} project${filtered.length !== 1 ? "s" : ""}` +
    (unmapped ? ` (${unmapped} without map location)` : "");
  document.getElementById("count-badge").textContent = badge;

  visibleFeatures = filtered;
  refreshFootprints();
}

// Wire up filter controls
["filter-jurisdiction","filter-type","filter-year-min","filter-year-max","filter-docs","filter-amis","filter-gaps"].forEach(id => {
  document.getElementById(id).addEventListener("change", applyFilters);
});
let searchTimeout;
document.getElementById("filter-search").addEventListener("input", () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(applyFilters, 300);
});
</script>
</body>
