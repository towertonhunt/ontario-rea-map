<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canada EA Atlas</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet.markercluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Header ── */
    #header {
      background: #1a3a5c;
      color: white;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      z-index: 1000;
    }
    #header h1 { font-size: 1rem; font-weight: 600; white-space: nowrap; }
    #header .subtitle { font-size: 0.75rem; opacity: 0.7; }

    /* ── Filter bar ── */
    #filters {
      background: #f0f4f8;
      border-bottom: 1px solid #d0d7de;
      padding: 8px 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    #filters label { font-size: 0.78rem; color: #555; font-weight: 500; }
    #filters select, #filters input[type=text] {
      font-size: 0.78rem;
      padding: 4px 8px;
      border: 1px solid #c0c8d0;
      border-radius: 4px;
      background: white;
    }
    .filter-group { display: flex; align-items: center; gap: 5px; }
    #count-badge {
      margin-left: auto;
      font-size: 0.75rem;
      background: #1a3a5c;
      color: white;
      padding: 3px 9px;
      border-radius: 10px;
    }

    /* ── Main layout ── */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── Map ── */
    #map { flex: 1; }

    /* ── Sidebar ── */
    #sidebar {
      width: 380px;
      min-width: 320px;
      background: white;
      border-left: 1px solid #d0d7de;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.2s;
    }
    #sidebar.hidden { width: 0; min-width: 0; }

    #sidebar-header {
      background: #1a3a5c;
      color: white;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      flex-shrink: 0;
    }
    #sidebar-header h2 { font-size: 0.95rem; font-weight: 600; line-height: 1.3; }
    #sidebar-close {
      background: none; border: none; color: white; font-size: 1.2rem;
      cursor: pointer; padding: 0; flex-shrink: 0; line-height: 1;
    }

    #sidebar-meta {
      padding: 10px 14px;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
      font-size: 0.8rem;
    }
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
    .meta-item label { color: #888; font-size: 0.72rem; display: block; text-transform: uppercase; letter-spacing: 0.03em; }
    .meta-item span { font-weight: 500; color: #222; }

    /* Type badge */
    .type-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .type-wind    { background: #dbeafe; color: #1e40af; }
    .type-solar   { background: #fef3c7; color: #92400e; }
    .type-biogas  { background: #dcfce7; color: #166534; }

    /* Doc sections */
    #doc-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
    }
    .doc-section { margin-bottom: 12px; }
    .doc-section-title {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
      margin-bottom: 5px;
      padding-bottom: 3px;
      border-bottom: 1px solid #eee;
    }
    .doc-link {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 4px 0;
      font-size: 0.8rem;
      color: #1a3a5c;
      text-decoration: none;
      line-height: 1.3;
    }
    .doc-link:hover { color: #2563eb; }
    .doc-link::before { content: "📄"; flex-shrink: 0; font-size: 0.85rem; }
    .no-docs { font-size: 0.82rem; color: #888; font-style: italic; padding: 8px 0; }

    /* Legend */
    #legend {
      position: absolute;
      bottom: 28px;
      left: 12px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.78rem;
      z-index: 999;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    #legend h4 { font-size: 0.75rem; margin-bottom: 7px; color: #444; }
    .legend-row { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
    .legend-icon { font-size: 1rem; line-height: 1; flex-shrink: 0; }

    /* Responsive */
    @media (max-width: 700px) {
      #sidebar { position: absolute; right: 0; top: 0; bottom: 0; z-index: 800; width: 100% !important; }
      #sidebar.hidden { width: 0 !important; }
    }
    .doc-archive { font-size: 0.72rem; color: #6b7280; margin-top: -4px; padding-left: 14px; }
</style>
</head>
<body>

<div id="header">
  <div>
    <h1>Canada EA Atlas</h1>
    <div class="subtitle">Environmental assessments from federal &amp; provincial registries · project documents</div>
  </div>
  <a href="search.html" style="margin-left:auto;color:#9fc3e8;font-size:0.85rem;text-decoration:none">Project Search →</a>
  <a href="wiki.html" style="margin-left:16px;color:#9fc3e8;font-size:0.85rem;text-decoration:none">Corpus Search →</a>
  <a href="predict.html" style="margin-left:16px;color:#9fc3e8;font-size:0.85rem;text-decoration:none">Mitigation Predictor →</a>
</div>

<div id="filters">
  <div class="filter-group">
    <label for="filter-jurisdiction">Jurisdiction</label>
    <select id="filter-jurisdiction">
      <option value="">All</option>
    </select>
  </div>
  <div class="filter-group">
    <label for="filter-type">Sector</label>
    <select id="filter-type">
      <option value="">All</option>
    </select>
  </div>
  <div class="filter-group">
    <label for="filter-year-min">Year</label>
    <select id="filter-year-min">
      <option value="">From</option>
    </select>
    <span style="font-size:0.8rem;color:#888">–</span>
    <select id="filter-year-max">
      <option value="">To</option>
    </select>
  </div>
  <div class="filter-group">
    <label for="filter-docs">Docs</label>
    <select id="filter-docs">
      <option value="">All projects</option>
      <option value="tech">Technical docs only</option>
      <option value="approval">Approval only</option>
    </select>
  </div>
  <div class="filter-group">
    <label for="filter-search">Search</label>
    <input type="text" id="filter-search" placeholder="Project or proponent…" style="width:170px" />
  </div>
  <div class="filter-group">
    <label for="filter-amis" style="cursor:pointer"><input type="checkbox" id="filter-amis" style="vertical-align:-1px" /> Abandoned mines</label>
  </div>
  <div class="filter-group">
    <label for="filter-gaps" style="cursor:pointer" title="Major projects listed in external inventories (NRCan) with no matching record in the EA registries this map harvests"><input type="checkbox" id="filter-gaps" style="vertical-align:-1px" /> Unmatched majors</label>
  </div>
  <span id="count-badge">– projects</span>
</div>

<div id="main">
  <div id="map"></div>

  <div id="sidebar" class="hidden">
    <div id="sidebar-header">
      <h2 id="sidebar-title">Select a project</h2>
      <button id="sidebar-close" title="Close">✕</button>
    </div>
    <div id="sidebar-meta"></div>
    <div id="doc-list"></div>
  </div>
</div>

<!-- Legend (inside map div so it floats over) -->
<div id="legend">
  <h4>Sector</h4>
  <div id="legend-rows"></div>
</div>
<script>
// Legend is generated from CATEGORY_META after it is defined below.
window.addEventListener("DOMContentLoaded", () => {
  const el = document.getElementById("legend-rows");
  for (const [key, meta] of Object.entries(CATEGORY_META)) {
    const row = document.createElement("div");
    row.className = "legend-row";
    row.innerHTML = `<span class="legend-icon" style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${meta.colour}"></span> ${meta.label}`;
    el.appendChild(row);
  }
});
</script>

<script>
// ── Map setup ──────────────────────────────────────────────────────────────
const map = L.map("map", {
  center: [56.5, -96],
  zoom: 4,
  zoomControl: true,
});

// Esri Light Gray Canvas (keyless; CARTO's free basemaps now require an API key).
// Native tiles end at zoom 16; maxNativeZoom upscales them beyond that.
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  attribution: 'Powered by <a href="https://www.esri.com/">Esri</a> — Esri, HERE, Garmin, © OpenStreetMap contributors',
  maxZoom: 19,
  maxNativeZoom: 16,
}).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19,
  maxNativeZoom: 16,
  pane: "shadowPane", // labels above the base tiles, below markers
}).addTo(map);

// ── SVG icon paths ─────────────────────────────────────────────────────────
// Wind turbine: tapered tower + 3 blades at 120° intervals + hub
const SVG_WIND = (c, op) => `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" width="38" height="38" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35))">
  <circle cx="19" cy="19" r="18" fill="white" opacity="${op}" stroke="${c}" stroke-width="2"/>
  <!-- tapered tower -->
  <polygon points="18.2,18 19.8,18 21,33 17,33" fill="${c}" opacity="${op}"/>
  <!-- 3 blades at 120° each — same teardrop shape, rotated around hub (19,18) -->
  <path d="M19,18 C17.8,15 17.5,11 19,8 C20.5,11 20.2,15 19,18Z" fill="${c}" opacity="${op}"/>
  <path d="M19,18 C17.8,15 17.5,11 19,8 C20.5,11 20.2,15 19,18Z" fill="${c}" opacity="${op}" transform="rotate(120,19,18)"/>
  <path d="M19,18 C17.8,15 17.5,11 19,8 C20.5,11 20.2,15 19,18Z" fill="${c}" opacity="${op}" transform="rotate(240,19,18)"/>
  <!-- hub: white fill covers blade roots and tower top cleanly -->
  <circle cx="19" cy="18" r="2.5" fill="white" opacity="${op}" stroke="${c}" stroke-width="1.8"/>
</svg>`;

// Solar panel array: sun above stylised panels
const SVG_SOLAR = (c, op) => `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" width="38" height="38" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35))">
  <circle cx="19" cy="19" r="18" fill="white" opacity="${op}" stroke="${c}" stroke-width="2"/>
  <!-- sun circle -->
  <circle cx="19" cy="13" r="4.5" fill="${c}" opacity="${op}"/>
  <!-- sun rays -->
  <g stroke="${c}" stroke-width="1.8" stroke-linecap="round" opacity="${op}">
    <line x1="19" y1="6"  x2="19" y2="4.5"/>
    <line x1="19" y1="20" x2="19" y2="21.5"/>
    <line x1="12" y1="13" x2="10.5" y2="13"/>
    <line x1="26" y1="13" x2="27.5" y2="13"/>
    <line x1="14" y1="8"  x2="13"   y2="7"/>
    <line x1="24" y1="8"  x2="25"   y2="7"/>
    <line x1="14" y1="18" x2="13"   y2="19"/>
    <line x1="24" y1="18" x2="25"   y2="19"/>
  </g>
  <!-- solar panel grid -->
  <g opacity="${op}">
    <rect x="9"  y="24" width="8"  height="6" rx="1" fill="${c}"/>
    <rect x="18.5" y="24" width="4" height="6" rx="1" fill="${c}"/>
    <rect x="24" y="24" width="5"  height="6" rx="1" fill="${c}"/>
    <line x1="11" y1="24" x2="11" y2="30" stroke="white" stroke-width="0.8"/>
    <line x1="13" y1="24" x2="13" y2="30" stroke="white" stroke-width="0.8"/>
    <line x1="15" y1="24" x2="15" y2="30" stroke="white" stroke-width="0.8"/>
    <line x1="9"  y1="27" x2="17" y2="27" stroke="white" stroke-width="0.8"/>
  </g>
</svg>`;

// Biogas: flame inside droplet shape
const SVG_BIOGAS = (c, op) => `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" width="38" height="38" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35))">
  <circle cx="19" cy="19" r="18" fill="white" opacity="${op}" stroke="${c}" stroke-width="2"/>
  <!-- flame -->
  <path d="M19 8
    C15 12 11 15 13 21
    C14 24 16 25 15 27
    C13 25 13 21 15 19
    C12 21 10 25 13 28
    C15 31 17 32 19 32
    C21 32 23 31 25 28
    C28 25 26 21 23 19
    C25 21 25 25 23 27
    C22 25 24 24 25 21
    C27 15 23 12 19 8Z"
    fill="${c}" opacity="${op}"/>
  <!-- inner highlight -->
  <path d="M19 14 C17 17 16 19 17 22 C18 24 19 24 19 14Z"
    fill="white" opacity="${op * 0.35}"/>
</svg>`;

const CATEGORY_META = {
  wind:         { colour: "#2563eb", label: "Wind" },
  solar:        { colour: "#d97706", label: "Solar" },
  biogas:       { colour: "#16a34a", label: "Biogas / biomass" },
  hydro:        { colour: "#0891b2", label: "Hydro / dams" },
  mining:       { colour: "#92400e", label: "Mining" },
  oil_gas:      { colour: "#57534e", label: "Oil & gas" },
  nuclear:      { colour: "#ca8a04", label: "Nuclear" },
  energy_other: { colour: "#7c3aed", label: "Other energy" },
  transport:    { colour: "#db2777", label: "Transport" },
  water:        { colour: "#0d9488", label: "Water / marine" },
  industrial:   { colour: "#4b5563", label: "Industrial" },
  waste:        { colour: "#65a30d", label: "Waste" },
  agriculture:  { colour: "#84cc16", label: "Agriculture" },
  tourism:      { colour: "#f472b6", label: "Tourism" },
  other:        { colour: "#6b7280", label: "Other" },
};

function makeIcon(feature, selected) {
  const cat = feature.properties.category || "other";
  const has = feature.properties.has_tech_docs || feature.properties.doc_count > 0;
  const op  = has ? 1 : 0.75;

  const meta = CATEGORY_META[cat] || CATEGORY_META.other;
  const c = selected ? "#dc2626" : meta.colour;

  // approximate (gazetteer-geocoded) locations render with a dashed ring
  const approx = feature.properties.geocode === "approximate";
  const dash = approx ? ' stroke-dasharray="4 3"' : "";

  let svgStr;
  if (cat === "wind")        svgStr = SVG_WIND(c, op);
  else if (cat === "solar")  svgStr = SVG_SOLAR(c, op);
  else if (cat === "biogas") svgStr = SVG_BIOGAS(c, op);
  else {
    // generic marker: coloured circle with first letter of category
    const letter = meta.label.charAt(0);
    svgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" width="38" height="38" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35))">
      <circle cx="19" cy="19" r="17" fill="white" opacity="${op}" stroke="${c}" stroke-width="2"${dash}/>
      <circle cx="19" cy="19" r="12" fill="${c}" opacity="${op * (approx ? 0.8 : 1)}"/>
      <text x="19" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="white">${letter}</text>
    </svg>`;
  }

  return L.divIcon({
    html: svgStr,
    className: "",
    iconSize: [38, 38],
    iconAnchor: [19, 19],
    popupAnchor: [0, -20],
  });
}

// ── Cluster group ──────────────────────────────────────────────────────────
const cluster = L.markerClusterGroup({
  maxClusterRadius: 40,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  iconCreateFunction(c) {
    const n = c.getChildCount();
    const size = n > 50 ? 44 : n > 20 ? 38 : 32;
    return L.divIcon({
      html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:#1a3a5c;color:white;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:600;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.3)">${n}</div>`,
      className: "",
      iconSize: [size, size],
      iconAnchor: [size/2, size/2],
    });
  },
});
map.addLayer(cluster);

// ── Sidebar logic ──────────────────────────────────────────────────────────
const sidebar      = document.getElementById("sidebar");
const sidebarTitle = document.getElementById("sidebar-title");
const sidebarMeta  = document.getElementById("sidebar-meta");
const docList      = document.getElementById("doc-list");

document.getElementById("sidebar-close").addEventListener("click", () => {
  sidebar.classList.add("hidden");
  if (activeMarker) { activeMarker.setIcon(makeIcon(activeMarker.feature, false)); activeMarker = null; }
});

let activeMarker = null;

function openSidebar(feature, marker) {
  const p = feature.properties;

  // Reset previous active marker
  if (activeMarker && activeMarker !== marker) {
    activeMarker.setIcon(makeIcon(activeMarker.feature, false));
  }
  activeMarker = marker;
  marker.setIcon(makeIcon(feature, true));  // purple = selected

  sidebarTitle.textContent = p.name;
  sidebar.classList.remove("hidden");

  // Meta section
  const catMeta = CATEGORY_META[p.category || "other"] || CATEGORY_META.other;
  const nth = northeyByKey[p.jurisdiction + "||" + p.name];
  const cap = p.capacity_mw ? `${p.capacity_mw} MW` : null;
  const turbines = p.num_turbines ? ` · ${p.num_turbines} turbines` : "";
  const panels   = p.num_panels   ? ` · ${p.num_panels} panels`   : "";
  const location = [p.location, p.municipality, p.county, p.region]
    .filter(Boolean).join(", ") || "—";

  const rows = [
    ["Jurisdiction", p.jurisdiction],
    ["Sector", catMeta.label],
    ["Status", p.status],
    ["EA type", p.ea_type],
    ["EA phase", p.ea_phase],
    ["Decision", p.decision],
    ["Proponent", p.proponent],
    cap ? ["Capacity", `${cap}${turbines}${panels}`] : null,
    ["Approved", p.approval_date],
    ["Location", location],
    p.rea_number ? ["REA Number", p.rea_number] : null,
    p.reference_number ? ["EA reference #", p.reference_number] : null,
    p.decision_date ? ["Decision date", p.decision_date] : null,
    p.doc_count ? ["Documents", `${p.doc_count} total`] : null,
    p.updated ? ["Updated", p.updated] : null,
    p.note ? ["Note", p.note] : null,
    nth ? ["Northey (2023)", `Landmark ${nth.regime} case, cited as of ${nth.y}`] : null,
  ].filter(r => r && r[1]);

  sidebarMeta.innerHTML = `
    <div style="margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="type-badge" style="background:${catMeta.colour}22;color:${catMeta.colour}">${catMeta.label}</span>
      ${nth ? `<span class="type-badge" title="Cited as a landmark case in Rodney Northey, A Guide to Canada's Impact Assessment Act (2023)" style="background:#7c3aed22;color:#6d28d9">★ Landmark case · ${nth.regime}</span>` : ""}
      ${p.procurement ? `<span style="font-size:0.72rem;color:#666">${p.procurement}</span>` : ""}
    </div>
    <div class="meta-grid">
      ${rows.map(([k, v]) => `<div class="meta-item"><label>${k}</label><span>${v}</span></div>`).join("")}
    </div>
    ${p.registry_url ? `<div style="margin-top:10px"><a href="${p.registry_url}" target="_blank" rel="noopener" style="font-size:0.8rem;color:#1a3a5c;font-weight:600">${p.archived ? "Open archived registry record" : "Open registry page"} ↗</a></div>` : ""}
    ${p.bape_url ? `<div style="margin-top:4px"><a href="${p.bape_url}" target="_blank" rel="noopener" style="font-size:0.8rem;color:#1a3a5c;font-weight:600">BAPE dossier (documents, hearings) ↗</a></div>` : ""}
    ${p.proponent_url ? `<div style="margin-top:4px"><a href="${p.proponent_url}" target="_blank" rel="noopener" style="font-size:0.8rem;color:#1a3a5c;font-weight:600">Proponent's project page ↗</a></div>` : ""}
    ${p.archived ? `<p style="margin-top:8px;font-size:0.72rem;color:#666">Archived record — assessed under CEAA 1992 and no longer served by the live registry; links point at the Agency's archive.</p>` : ""}
    ${p.geocode === "approximate" ? `<p style="margin-top:8px;font-size:0.72rem;color:#a16207">⚠ Approximate location — pinned to the nearest named place (${(p.geocode_match || "").replace("name:", "")}). The registry does not publish coordinates for this project.</p>` : ""}
    ${p.description ? `<p style="margin-top:8px;font-size:0.78rem;color:#555;line-height:1.4">${p.description}</p>` : ""}`;

  // Document sections
  docList.innerHTML = "";
  if (!p.doc_sections || p.doc_sections.length === 0) {
    if (p.docs_path) {
      // Lazy-load the per-project document catalogue (BC etc.)
      docList.innerHTML = `<p class="no-docs">Loading ${p.doc_count || ""} documents…</p>`;
      fetch(p.docs_path)
        .then(r => r.json())
        .then(cat => {
          if (activeMarker && activeMarker.feature.properties !== p) return; // stale click
          docList.innerHTML = "";
          const sec = document.createElement("div");
          sec.className = "doc-section";
          sec.innerHTML = `<div class="doc-section-title">Registry documents (${cat.docs.length})</div>`;
          for (const doc of cat.docs) {
            const a = document.createElement("a");
            a.className = "doc-link";
            a.href = doc.url;
            a.target = "_blank";
            a.rel = "noopener";
            const title = doc.title && doc.title.length > 80
              ? doc.title.substring(0, 78) + "…" : (doc.title || "Document");
            const label = doc.code ? `${doc.code} · ${title}` : title;
            a.textContent = doc.date ? `${label} (${doc.date})` : label;
            sec.appendChild(a);
            if (doc.archive_url) {
              const b = document.createElement("a");
              b.className = "doc-link doc-archive";
              b.href = doc.archive_url;
              b.target = "_blank";
              b.rel = "noopener";
              b.title = "Permanent copy in the Canada EA Atlas archive";
              b.textContent = "archived copy ↗";
              sec.appendChild(b);
            }
          }
          docList.appendChild(sec);
        })
        .catch(() => {
          docList.innerHTML = `<p class="no-docs">Could not load documents — use the registry page link above.</p>`;
        });
      return;
    }
    docList.innerHTML = `<p class="no-docs">${p.registry_url
      ? "Documents are available on this project's registry page."
      : "No documents found for this project."}</p>`;
    return;
  }

  for (const section of p.doc_sections) {
    const sec = document.createElement("div");
    sec.className = "doc-section";
    sec.innerHTML = `<div class="doc-section-title">${section.label} (${section.docs.length})</div>`;

    for (const doc of section.docs) {
      const a = document.createElement("a");
      a.className = "doc-link";
      a.href = doc.url;
      a.target = "_blank";
      a.rel = "noopener";
      // Truncate long titles
      const title = doc.title && doc.title.length > 80
        ? doc.title.substring(0, 78) + "…"
        : (doc.title || doc.label);
      a.textContent = title;
      sec.appendChild(a);
    }
    docList.appendChild(sec);
  }
}

// ── Load GeoJSON ───────────────────────────────────────────────────────────
let allFeatures = [];
let allMarkers  = [];  // parallel array to allFeatures

// Northey landmark cases (data/api/northey.json), keyed by jurisdiction||name —
// the same identity the stable project id is hashed from.
let northeyByKey = {};
fetch("data/api/northey.json")
  .then(r => r.ok ? r.json() : null)
  .then(d => { if (d) for (const x of d.projects) northeyByKey[x.j + "||" + x.n] = x; })
  .catch(() => {});

fetch("data/projects_canada.geojson")
  .then(r => r.ok ? r.json() : fetch("projects.geojson").then(r2 => r2.json()))
  .then(data => {
    allFeatures = data.features;
    buildYearFilters();
    buildDynamicFilters();
    applyFilters();
  })
  .catch(err => console.error("Failed to load GeoJSON:", err));

function buildYearFilters() {
  const years = [...new Set(allFeatures.map(f => f.properties.approval_year).filter(Boolean))].sort();
  const minSel = document.getElementById("filter-year-min");
  const maxSel = document.getElementById("filter-year-max");
  years.forEach(y => {
    minSel.add(new Option(y, y));
    maxSel.add(new Option(y, y));
  });
}

function buildDynamicFilters() {
  const jurs = [...new Set(allFeatures.map(f => f.properties.jurisdiction).filter(Boolean))].sort();
  const jSel = document.getElementById("filter-jurisdiction");
  jurs.forEach(j => jSel.add(new Option(j, j)));

  const cats = [...new Set(allFeatures.map(f => f.properties.category).filter(Boolean))];
  const order = Object.keys(CATEGORY_META);
  cats.sort((a, b) => order.indexOf(a) - order.indexOf(b));
  const tSel = document.getElementById("filter-type");
  cats.forEach(c => tSel.add(new Option((CATEGORY_META[c] || {}).label || c, c)));
}

function applyFilters() {
  const jurVal    = document.getElementById("filter-jurisdiction").value;
  const typeVal   = document.getElementById("filter-type").value;
  const yearMin   = parseInt(document.getElementById("filter-year-min").value) || 0;
  const yearMax   = parseInt(document.getElementById("filter-year-max").value) || 9999;
  const docsVal   = document.getElementById("filter-docs").value;
  const search    = document.getElementById("filter-search").value.trim().toLowerCase();

  const showAmis = document.getElementById("filter-amis").checked;
  const showGaps = document.getElementById("filter-gaps").checked;
  const filtered = allFeatures.filter(f => {
    const p = f.properties;
    // Abandoned mines are a reference layer: hidden unless toggled on or
    // explicitly selected in the jurisdiction filter
    if (p.source === "on_amis" && !showAmis && jurVal !== p.jurisdiction) return false;
    // Unmatched inventory majors (gap overlay): same opt-in treatment
    if (p.source === "nrcan_gap" && !showGaps && jurVal !== p.jurisdiction) return false;
    if (jurVal && p.jurisdiction !== jurVal) return false;
    if (typeVal && p.category !== typeVal) return false;
    if (yearMin && (p.approval_year || 0) < yearMin) return false;
    if (yearMax < 9999 && (p.approval_year || 0) > yearMax) return false;
    if (docsVal === "tech"     && !p.has_tech_docs) return false;
    if (docsVal === "approval" &&  p.has_tech_docs) return false;
    if (search) {
      const haystack = `${p.name} ${p.proponent || ""} ${p.municipality || ""} ${p.county || ""} ${p.location || ""} ${p.jurisdiction || ""}`.toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });

  // Rebuild cluster layer
  cluster.clearLayers();
  allMarkers = [];
  let unmapped = 0;

  filtered.forEach(feature => {
    if (!feature.geometry || !feature.geometry.coordinates) { unmapped++; return; }
    const [lng, lat] = feature.geometry.coordinates;
    const marker = L.marker([lat, lng], { icon: makeIcon(feature, false) });
    marker.feature = feature;
    marker.on("click", () => openSidebar(feature, marker));
    allMarkers.push(marker);
    cluster.addLayer(marker);
  });

  const badge = `${filtered.length} project${filtered.length !== 1 ? "s" : ""}` +
    (unmapped ? ` (${unmapped} without map location)` : "");
  document.getElementById("count-badge").textContent = badge;
}

// Wire up filter controls
["filter-jurisdiction","filter-type","filter-year-min","filter-year-max","filter-docs","filter-amis","filter-gaps"].forEach(id => {
  document.getElementById(id).addEventListener("change", applyFilters);
});
let searchTimeout;
document.getElementById("filter-search").addEventListener("input", () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(applyFilters, 300);
});
</script>
